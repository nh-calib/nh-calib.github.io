<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="pt pd"><title id="pt">How one sensor reads its own lever arm and yaw offset out of vehicle motion</title><desc id="pd">Schematic. Left panel: a vehicle moving forward through a gentle turn. Forward speed makes yaw observable, while each accepted curvature couples yaw and longitudinal lever arm differently. Right panel: the same vehicle in a steady turn about an instantaneous centre of rotation. The axle point is still lateral-free, while the sensor, mounted a lever arm ahead of it, gains a lateral velocity equal to the turn rate times that lever arm. A readout below plots lateral velocity against turn rate: the near-zero turn-rate band is gated out and accepted turns constrain yaw and lever arm jointly. No numbers with units appear; the figure is a mechanism sketch, not a measurement.</desc><style>
