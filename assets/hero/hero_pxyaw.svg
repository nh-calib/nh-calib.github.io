eName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.44;1" dur="4.5s" calcMode="linear" repeatCount="indefinite"/></path><g><animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.44;1"><mpath href="#pbTrail" xlink:href="#pbTrail"/></animateMotion><use href="#asmTurn" xlink:href="#asmTurn"/></g><g><animateMotion dur="4.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.44;1"><mpath href="#pbL0" xlink:href="#pbL0"/></animateMotion><text x="0" y="0" class="symi" text-anchor="start">p</text><text x="17" y="9" class="symi-s" text-anchor="start">x</text></g><g><animateMotion dur="4.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.44;1"><mpath href="#pbL1" xlink:href="#pbL1"/></animateMotion><text x="0" y="0" class="syma" text-anchor="start">&#969; p</text><text x="47" y="9" class="syma-s" text-anchor="start">x</text></g><rect x="60" y="660" width="1480" height="216" rx="14" class="panel"/><text x="110" y="716" class="h" text-anchor="start">One line, two unknowns</text><text x="110" y="758" class="symi" text-anchor="start">slope &#8594; p</text><text x="250" y="767" class="symi-s" text-anchor="start">x</text><text x="110" y="798" class="symi" text-anchor="start">origin &#8594; &#968;</text><line x1="544" y1="768" x2="1036" y2="768" class="rule-line"/><line x1="790" y1="690" x2="790" y2="846" class="rule-line"/><text x="1048" y="778" class="sym" text-anchor="start">&#969;</text><text x="772" y="690" class="lbl" text-anchor="end">lateral velocity in vehicle axes</text><path d="M 560 830 L 1020 706" class="fit" id="fitLine"/><circle cx="570" cy="827.3" r="9" class="acc-open"/><text x="582" y="864" class="lbl" text-anchor="start">opposite turn</text><rect x="762" y="690" width="56" height="156" class="gate-band"/><text x="806" y="802" class="lbl" text-anchor="start">gated band</text><text x="1014" y="690" class="lbl" text-anchor="end">turning frames</text>