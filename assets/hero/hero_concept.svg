<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="ht hd"><title id="ht">How NH-Calib reads a mounting offset out of a turn</title><desc id="hd">Schematic. Two panels show the same vehicle driving a left turn and a right turn. In each panel the reference sensor and the target sensor trace arcs of different radius about a shared instantaneous centre of rotation, and the difference of those radii is the lateral mounting offset. A bar below shows the accumulated path-length difference growing and reversing sign between the two turns. No numbers with units appear: the figure is a mechanism sketch, not a measurement.</desc><style>
    .panel { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1.6; }
    .fg-thin { fill: none; stroke: #666666; stroke-width: 1.8; }
    .fg-arrow { fill: none; stroke: #666666; stroke-width: 2.4; }
    .rule-line { fill: none; stroke: #d8d8d8; stroke-width: 2; }
    .rule-dash { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 7 6; }
    .bracket { fill: none; stroke: #191919; stroke-width: 2.4; }
    .axle { fill: none; stroke: #191919; stroke-width: 6; stroke-linecap: round; }
    .trace-ref { fill: none; stroke: #191919; stroke-width: 5; stroke-linecap: round; }
    .trace-tgt { fill: none; stroke: #a52e29; stroke-width: 5; stroke-linecap: round; }
    .ink-fill { fill: #191919; stroke: #ffffff; stroke-width: 2.5; }
    .acc-fill { fill: #a52e29; stroke: #ffffff; stroke-width: 2.5; }
    .icr-dot { fill: #ffffff; stroke: #666666; stroke-width: 3; }
    .badge { fill: #f5f5f3; stroke: #d8d8d8; stroke-width: 1.4; }
    .bar-neg { fill: #191919; }
    .bar-pos { fill: #a52e29; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #191919; }
    .badge-t { font-size: 27px; font-weight: 700; letter-spacing: .01em; }
    .h { font-size: 33px; font-weight: 700; }
    .lbl { font-size: 24px; fill: #666666; }
    .note { font-size: 26px; fill: #666666; }
    .sym { font-size: 30px; font-weight: 700; fill: #666666; }
    .sym-sub { font-size: 21px; font-weight: 700; fill: #666666;
                font-family: Arial, Helvetica, sans-serif; }
    .big { font-size: 54px; font-weight: 700; }
    .sym-sub-big { font-size: 26px; fill: #666666;
                    font-family: Arial, Helvetica, sans-serif; }
</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker><marker id="tip-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#191919"/></marker><g id="veh0"><line x1="0" y1="0" x2="0" y2="-70" class="axle"/><line x1="16" y1="-35" x2="52" y2="-35" class="fg-arrow" marker-end="url(#tip)"/><circle cx="0" cy="0" r="11" class="ink-fill"/><circle cx="0" cy="-70" r="11" class="acc-fill"/></g><g id="veh1"><line x1="0" y1="0" x2="0" y2="-70" class="axle"/><line x1="16" y1="-35" x2="52" y2="-35" class="fg-arrow" marker-end="url(#tip)"/><circle cx="0" cy="0" r="11" class="ink-fill"/><circle cx="0" cy="-70" r="11" class="acc-fill"/></g></defs><rect width="1600" height="900" fill="#ffffff"/><rect x="153.7" y="24" width="432.8" height="52" rx="26" class="badge"/><text x="370.1" y="59" class="badge-t" text-anchor="middle">No target, no calibration site</text><rect x="612.5" y="24" width="357" height="52" rx="26" class="badge"/><text x="791" y="59" class="badge-t" text-anchor="middle">No shared field of view</text><rect x="995.5" y="24" width="450.8" height="52" rx="26" class="badge"/><text x="1220.9" y="59" class="badge-t" text-anchor="middle">Timing touches one parameter</text><rect x="60" y="100" width="730" height="530" rx="14" class="panel"/><text x="92" y="152" class="h" text-anchor="start">Left turn</text><line x1="92" y1="596" x2="134" y2="596" class="trace-ref"/><text x="146" y="604" class="lbl" text-anchor="start">reference sensor</text><line x1="360" y1="596" x2="402" y2="596" class="trace-tgt"/><text x="414" y="604" class="lbl" text-anchor="start">target sensor</text><g class="icr"><circle cx="425" cy="215" r="9" class="icr-dot"/><line x1="403" y1="215" x2="447" y2="215" class="fg-thin"/><line x1="425" y1="193" x2="425" y2="237" class="fg-thin"/><text x="4