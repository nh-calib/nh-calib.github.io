<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="pt pd"><title id="pt">Why the slope of a sensor's lateral against longitudinal speed is its mounting yaw</title><desc id="pd">Schematic in three steps. Left: a car seen from above with a sensor mounted a lever arm ahead of the rear axle and rotated by the yaw angle psi. Step 1: in a turn the sensor's measured velocity (gray) is the body's forward velocity (black) plus a sideways part equal to the turn rate times the lever arm (blue); from sample to sample the gray arrow swings. Step 2: that sideways part is known from the rate fit and is subtracted, leaving only the forward velocity along the heading. Step 3: the sensor's own axes are rotated by psi, so the forward velocity splits into a longitudinal component v cos psi and a lateral component minus v sin psi. Right: the sensor's own frame, one dot per sample. Measured dots scatter with the turn; after the subtraction every dot slides onto one line through the origin whose angle is psi, so lateral over longitudinal speed is minus tan psi at any speed. No numbers with units appear.</desc><style>
