</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker><marker id="tip-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#191919"/></marker><marker id="tip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a52e29"/></marker><marker id="tip-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="tip-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="800" y="44" class="h" text-anchor="middle">Yaw from one sensor: remove the turn part, then read the angle of what is left</text><rect x="60" y="66" width="476" height="54" rx="27" class="pill"/><circle cx="88" cy="93" r="16" class="badge-off"/><text x="88" y="101" class="badge-t" text-anchor="middle">1</text><text x="116" y="101" class="pill-off" text-anchor="start">Remove the turn part &#969;&#183;p<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><rect x="562" y="66" width="476" height="54" rx="27" class="pill"/><circle cx="590" cy="93" r="16" class="badge-off"/><text x="590" y="101" class="badge-t" text-anchor="middle">2</text><text x="618" y="101" class="pill-off" text-anchor="start">Only the forward speed is left</text><rect x="1064" y="66" width="476" height="54" rx="27" class="pill"/><circle cx="1092" cy="93" r="16" class="badge-off"/><text x="1092" y="101" class="badge-t" text-anchor="middle">3</text><text x="1120" y="101" class="pill-off" text-anchor="start">Read it on the sensor axes: tan&#8201;&#968;</text><rect x="1064" y="66" width="476" height="54" rx="27" class="pill-on"/><circle cx="1092" cy="93" r="16" class="acc-fill"/><text x="1092" y="101" class="badge-t" text-anchor="middle">3</text><text x="1120" y="101" class="pill-t" text-anchor="start">Read it on the sensor axes: tan&#8201;&#968;</text><text x="800" y="162" class="note" text-anchor="middle">The sensor axes are rotated by &#968;, so v splits into &#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan> = v cos&#8201;&#968; and &#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan> = &#8722;v sin&#8201;&#968;: their ratio is &#8722;tan&#8201;&#968; at any speed.</text><rect x="60" y="186" width="730" height="574" rx="14" class="panel"/><text x="92" y="230" class="h" text-anchor="start">Top view</text><text x="92" y="262" class="lbl" text-anchor="start">sensor a lever p<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan> ahead of the rear axle, mounted at yaw &#968;</text><rect x="141" y="449" width="48" height="18" rx="6" class="tyre"/><rect x="141" y="573" width="48" height="18" rx="6" class="tyre"/><rect x="366" y="449" width="48" height="18" rx="6" class="tyre"/><rect x="366" y="573" width="48" height="18" rx="6" class="tyre"/><path d="M 121 458 L 371 458 Q 435 458 435 500 L 435 540 Q 435 582 371 582 L 121 582 Q 95 582 95 556 L 95 484 Q 95 458 121 458 Z" class="body"/><path d="M 141 472 L 115 484 L 115 556 L 141 568 Z" class="glass"/><rect x="145" y="470" width="134" height="100" rx="12" class="roof"/><path d="M 283 472 L 317 486 L 317 554 L 283 568 Z" class="glass"/><ellipse cx="287" cy="454" rx="11" ry="5" class="tyre"/><ellipse cx="287" cy="586" rx="11" ry="5" class="tyre"/><rect x="426" y="472" width="7" height="14" rx="3" class="lamp"/><rect x="426" y="554" width="7" height="14" rx="3" class="lamp"/><line x1="165" y1="454" x2="165" y2="586" class="axle"/><circle cx="165" cy="520" r="9" class="ink-fill"/><g transform="translate(165 520)"><g transform="scale(1 1)"><path d="M 36 -25.2 A 44 44 0 0 0 -36 -25.2" class="omega" marker-end="url(#tip-i)"/></g></g><text x="103" y="530" class="symi" text-anchor="end">&#969;</text><line x1="355" y1="520" x2="745" y2="520" class="rule-dash"/><text x="745" y="554" class="lbl" text-anchor="end">heading</text><g transform="translate(355 520) rotate(-14)"><line x1="0" y1="0" x2="390" y2="0" class="axis-dash"/><line x1="0" y1="0" x2="0" y2="-130" class="axis-dash"/><rect x="-22" y="-16" width="44" height="32" rx="5" class="acc-fill"/></g><text x="741.4" y="433.7" class="syma" text-anchor="start">x&#771;</text><text x="315.6" y="383.9" class="syma" text-anchor="start">y&#771;</text><path d="M 505 520 A 150 150 0 0 0 500.5 483.7" class="fg-thin"/><text x="513" y="512" class="sym" text-anchor="start">&#968;</text><line x1="355" y1="520" y2="520" class="v-ink" marker-end="url(#tip-i)" x2="654.5"></line><text class="symi" text-anchor="middle" x="504.8" y="556">v</text><line x1="355" y1="520" class="comp-strong" marker-end="url(#tip-a)" x2="637" y2="449.7"></line><line class="comp-strong" marker-end="url(#tip-a)" x1="637" y1="449.7" x2="654.5" y2="520"></line><text class="syma" x="510.5" y="455.1">&#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><text class="syma" x="661.3" y="477">&#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan></text><line x1="92" y1="694" x2="126" y2="694" class="raw-v"/><text x="138" y="702" class="lbl" text-anchor="start">measured sensor velocity</text><line x1="440" y1="694" x2="474" y2="694" class="lat"/><text x="486" y="702" class="lbl" text-anchor="start">turn part &#969;&#183;p<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><line x1="92" y1="728" x2="126" y2="728" class="v-ink"/><text x="138" y="736" class="lbl" text-anchor="start">body forward velocity v</text><line x1="440" y1="728" x2="474" y2="728" class="comp-strong"/><text x="486" y="736" class="lbl" text-anchor="start">v on the sensor axes</text><rect x="810" y="186" width="730" height="574" rx="14" class="panel"/><text x="842" y="230" class="h" text-anchor="start">Sensor frame</text><text x="842" y="262" class="lbl" text-anchor="start">one dot per sample, plotted as (&#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan>, &#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan>)</text><line x1="880" y1="420" x2="1410" y2="420" class="fg-arrow" marker-end="url(#tip)"/><line x1="880" y1="710" x2="880" y2="280" class="fg-arrow" marker-end="url(#tip)"/><text x="1400" y="460" class="sym" text-anchor="start">&#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><text x="896" y="302" class="sym" text-anchor="start">&#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan></text><g opacity="0.90"><line x1="880" y1="420" x2="1384.6" y2="545.8" class="fit-acc"/><path d="M 1000 420 A 120 120 0 0 1 996.4 449" class="fg-thin"/><text x="1010" y="444" class="sym" text-anchor="start">&#968;</text></g><g><line x1="880" y1="420" x2="1237.1" y2="420" class="leg"/><line x1="1237.1" y1="420" x2="1237.1" y2="509" class="leg"/><text x="994.3" y="406" class="syma" text-anchor="middle">&#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><text x="1251.1" y="476.5" class="syma" text-anchor="start">&#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan></text><text x="1410" y="656" class="slope" text-anchor="end">&#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan> = &#8722;tan&#8201;&#968; &#183; &#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><text x="1410" y="688" class="lbl" text-anchor="end">same line at every speed</text></g><circle cx="1129.9" cy="368.5" r="9" class="ring"></circle><line x1="1129.9" y1="368.5" x2="1103.2" y2="475.6" class="drop" opacity="0.80"></line><circle cx="1103.2" cy="475.6" r="9" class="acc-fill" opacity="0.55"></circle><circle cx="1168" cy="596.1" r="9" class="ring"></circle><line x1="1168" y1="596.1" x2="1192.4" y2="497.9" class="drop" opacity="0.80"></line><circle cx="1192.4" cy="497.9" r="9" class="acc-fill" opacity="0.55"></circle><circle cx="1297.3" cy="457.7" r="9" class="ring"></circle><line x1="1297.3" y1="457.7" x2="1281.7" y2="520.2" class="drop" opacity="0.80"></line><circle cx="1281.7" cy="520.2" r="9" class="acc-fill" opacity="0.55"></circle><circle cx="1107.7" cy="609.5" r="9" class="ring"></circle><line x1="1107.7" y1="609.5" x2="1138.9" y2="484.5" class="drop" opacity="0.80"></line><circle cx="1138.9" cy="484.5" r="9" class="acc-fill" opacity="0.55"></circle><circle cx="1292.9" cy="608.3" r="9" class="ring"></circle><line x1="1292.9" y1="608.3" x2="1312.9" y2="527.9" class="drop" opacity="0.80"></line><circle cx="1312.9" cy="527.9" r="9" class="acc-fill" opacity="0.55"></circle><circle cx="1069.7" cy="419.9" r="9" class="ring"></circle><line x1="1069.7" y1="419.9" x2="1058.5" y2="464.5" class="drop" opacity="0.80"></line><circle cx="1058.5" cy="464.5" r="9" class="acc-fill" opacity="0.55"></circle><circle cx="1270.5" cy="375.1" r="9" class="ring"></circle><line x1="1270.5" y1="375.1" x2="1237.1" y2="509" class="drop" opacity="0.80"></line><circle cx="1237.1" cy="509" r="9" class="acc-fill" opacity="0.55"></circle><line x1="880" y1="420" class="comp-strong" marker-end="url(#tip-a)" x2="1325.6" y2="531.1"></line><circle r="12" class="acc-fill" cx="1325.6" cy="531.1"></circle><text x="842" y="736" class="lbl" text-anchor="start">hollow: measured &#183; red: after removing &#969;&#183;p<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><rect x="60" y="776" width="1480" height="108" rx="14" class="strip"/><text x="92" y="828" class="eq" text-anchor="start">&#7805; = R(&#968;)&#7488; (v, &#969;&#183;p<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan>)</text><text x="450" y="828" class="eq" text-anchor="start">&#8722;&#969;&#183;p<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan>  &#8594;  &#7805; = v (cos&#8201;&#968;, &#8722;sin&#8201;&#968;)</text><text x="960" y="828" class="eq" text-anchor="start">&#7805;<tspan dy="7" font-size="72%">y</tspan><tspan dy="-7">&#8202;</tspan> = &#8722;tan&#8201;&#968; &#183; &#7805;<tspan dy="7" font-size="72%">x</tspan><tspan dy="-7">&#8202;</tspan></text><text x="412" y="828" class="eq-m" text-anchor="middle">&#8594;</text><text x="917" y="828" class="eq-m" text-anchor="middle">&#8594;</text><text x="92" y="866" class="lbl" text-anchor="start">body frame (forward, lateral) resolved on the sensor axes</text><text x="1508" y="866" class="lbl" text-anchor="end">schematic &#183; &#968; exaggerated</text></svg>