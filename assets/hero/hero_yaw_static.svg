<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="pt pd"><title id="pt">Why the slope of a sensor's lateral against longitudinal speed is its mounting yaw</title><desc id="pd">Schematic. Left: a vehicle seen from above, with a sensor mounted rotated by the yaw angle psi. The body moves along its own heading; in a turn the sensor also moves sideways by the turn rate times its longitudinal lever arm, and that part is read off the rate plot of the same sensor and removed. What remains is the body's forward velocity, which the sensor resolves on its own rotated axes into a longitudinal and a lateral component. The raw sensor velocity changes direction from turn to turn; once the turn part is removed it always points along the heading, at psi from the sensor's longitudinal axis, whatever the speed. Right: the sensor's own frame. Each sample drops a dot; raw readings scatter with the turn, and once the turn part is removed every dot falls on one line through the origin whose angle to the longitudinal axis is psi, so the slope is minus tan psi. Zero forward speed puts the dot on the origin and carries no yaw information. No numbers with units appear.</desc><style>
    .panel { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1.6; }
    .strip { fill: #f5f5f3; stroke: #d8d8d8; stroke-width: 1.6; }
    .body { fill: #f5f5f3; stroke: #d8d8d8; stroke-width: 1.8; }
    .tyre { fill: #191919; }
    .glass { fill: #dde3ea; stroke: #d8d8d8; stroke-width: 1.4; }
    .roof { fill: #ececea; stroke: #d8d8d8; stroke-width: 1.4; }
    .lamp { fill: #f2d98a; }
    .rawv { fill: none; stroke: #666666; stroke-width: 4; }
    .axle { fill: none; stroke: #191919; stroke-width: 6; stroke-linecap: round; }
    .fg-thin { fill: none; stroke: #666666; stroke-width: 1.8; }
    .fg-arrow { fill: none; stroke: #666666; stroke-width: 2.4; }
    .rule-dash { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 7 6; }
    .ink-dash { fill: none; stroke: #666666; stroke-width: 1.6; stroke-dasharray: 6 6; }
    .axis-dash { fill: none; stroke: #a52e29; stroke-width: 1.8; stroke-dasharray: 8 7; opacity: .75; }
    .v-ink { fill: none; stroke: #191919; stroke-width: 4.5; }
    .comp-strong { fill: none; stroke: #a52e29; stroke-width: 4; }
    .lat { fill: none; stroke: #1d4ed8; stroke-width: 4.5; }
    .drop { fill: none; stroke: #1d4ed8; stroke-width: 2.2; stroke-dasharray: 5 5; }
    .fit-acc { fill: none; stroke: #a52e29; stroke-width: 3; }
    .raw { fill: #ffffff; stroke: #1d4ed8; stroke-width: 3; }
    .ink-fill { fill: #191919; stroke: #ffffff; stroke-width: 2.5; }
    .acc-fill { fill: #a52e29; stroke: #ffffff; stroke-width: 2.5; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #191919; }
    .h { font-size: 33px; font-weight: 700; }
    .lbl { font-size: 22px; fill: #666666; }
    .note { font-size: 24px; fill: #666666; }
    .eq { font-size: 31px; font-weight: 700; fill: #191919; }
    .slope { font-size: 27px; font-weight: 700; fill: #a52e29; }
    .sym { font-size: 30px; font-weight: 700; fill: #666666; }
    .sym-s { font-size: 21px; font-weight: 700; fill: #666666; }
    .symi { font-size: 30px; font-weight: 700; fill: #191919; }
    .syma { font-size: 30px; font-weight: 700; fill: #a52e29; }
    .syma-s { font-size: 21px; font-weight: 700; fill: #a52e29; }
    .symb-s { font-size: 19px; font-weight: 700; fill: #1d4ed8; }
    .symb { font-size: 27px; font-weight: 700; fill: #1d4ed8; }
</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker><marker id="tip-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#191919"/></marker><marker id="tip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a52e29"/></marker><marker id="tip-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="800" y="48" class="h" text-anchor="middle">Take the turn part out, and lateral over longitudinal speed is the mount angle.</text><text x="800" y="84" class="lbl" text-anchor="middle">One sensor, its own twist &#8212; the slope of that line is &#8722;tan&#8201;&#968;.</text><rect x="60" y="104" width="730" height="530" rx="14" class="panel"/><text x="92" y="150" class="h" text-anchor="start">Sensor mounted at yaw &#968;</text><text x="92" y="184" class="lbl" text-anchor="start">the body moves along its heading; the sensor sees it rotated</text><text x="92" y="574" class="note" text-anchor="start">black v: body velocity &#8212; its size keeps changing</text><text x="92" y="603" class="note" text-anchor="start">red: the same v on the sensor axes &#8212; fixed ratio</text><rect x="151" y="349" width="48" height="18" rx="6" class="tyre"/><rect x="151" y="473" width="48" height="18" rx="6" class="tyre"/><rect x="376" y="349" width="48" height="18" rx="6" class="tyre"/><rect x="376" y="473" width="48" height="18" rx="6" class="tyre"/><path d="M 131 358 L 381 358 Q 445 358 445 400 L 445 440 Q 445 482 381 482 L 131 482 Q 105 482 105 456 L 105 384 Q 105 358 131 358 Z" class="body"/><path d="M 151 372 L 125 384 L 125 456 L 151 468 Z" class="glass"/><rect x="155" y="370" width="134" height="100" rx="12" class="roof"/><path d="M 293 372 L 327 386 L 327 454 L 293 468 Z" class="glass"/><ellipse cx="297" cy="354" rx="11" ry="5" class="tyre"/><ellipse cx="297" cy="486" rx="11" ry="5" class="tyre"/><rect x="436" y="372" width="7" height="14" rx="3" class="lamp"/><rect x="436" y="454" width="7" height="14" rx="3" class="lamp"/><line x1="175" y1="354" x2="175" y2="486" class="axle"/><circle cx="175" cy="420" r="9" class="ink-fill"/><line x1="365" y1="420" x2="685" y2="420" class="rule-dash"/><g transform="translate(365 420) rotate(-14)"><line x1="0" y1="0" x2="330" y2="0" class="axis-dash"/><line x1="0" y1="0" x2="0" y2="-120" class="axis-dash"/><rect x="-22" y="-16" width="44" height="32" rx="5" class="acc-fill"/><text x="338" y="8" class="syma" text-anchor="start">x&#771;</text><text x="-10" y="-130" class="syma" text-anchor="start">y&#771;</text></g><path d="M 435 420 A 70 70 0 0 0 432.9 403.1" class="fg-thin"/><text x="439" y="414" class="sym" text-anchor="start">&#968;</text><line x1="365" y1="420" x2="531.1" y2="420" class="v-ink" marker-end="url(#tip-i)"/><text x="552.2" y="460" class="symi" text-anchor="start">v</text><g transform="translate(365 420) rotate(-14)"><line x1="0" y1="0" x2="161.2" y2="0" class="comp-strong" marker-end="url(#tip-a)"/><line x1="0" y1="0" x2="0" y2="40.2" class="comp-strong" marker-end="url(#tip-a)"/><line x1="161.2" y1="0" x2="161.2" y2="40.2" class="ink-dash"/><line x1="0" y1="40.2" x2="161.2" y2="40.2" class="ink-dash"/></g><text x="575.8" y="335" class="syma" text-anchor="start">&#7805;</text><text x="591.8" y="344" class="syma-s" text-anchor="start">x</text><text x="379" y="521" class="syma" text-anchor="start">&#7805;</text><text x="395" y="530" class="syma-s" text-anchor="start">y</text><rect x="810" y="104" width="730" height="530" rx="14" class="panel"/><text x="842" y="150" class="h" text-anchor="start">The sensor's own frame</text><text x="842" y="184" class="lbl" text-anchor="start">the red vector from the left, plotted as (x&#771;, y&#771;)</text><text x="842" y="574" class="note" text-anchor="start">speed slides the dot back and forth along the line</text><text x="842" y="603" class="note" text-anchor="start">it never leaves it: one line through the origin</text><line x1="890" y1="345" x2="1460" y2="345" class="fg-arrow" marker-end="url(#tip)"/><line x1="890" y1="545" x2="890" y2="215" class="fg-arrow" marker-end="url(#tip)"/><text x="1440" y="385" class="sym" text-anchor="start">&#7805;</text><text x="1456" y="394" class="sym-s" text-anchor="start">x</text><text x="906" y="233" class="lbl" text-anchor="start">lateral &#8722; turn part</text><line x1="890" y1="345" x2="1414" y2="475.6" class="fit-acc"/><path d="M 1040 345 A 150 150 0 0 1 1035.5 381.3" class="fg-thin"/><text x="1052" y="375" class="sym" text-anchor="start">&#968;</text><text x="1450" y="295" class="slope" text-anchor="end">slope = &#8722;tan&#8201;&#968;</text><g opacity="0.35"><circle cx="1295.1" cy="446" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1248.2" cy="434.3" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1270.4" cy="439.9" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1251.8" cy="435.2" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1276.6" cy="441.4" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1332.6" cy="455.3" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1243.9" cy="433.2" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1166.2" cy="413.9" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1097.1" cy="396.6" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1025" cy="378.7" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1099.7" cy="397.3" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1142.3" cy="407.9" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1134.7" cy="406" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1168.5" cy="414.4" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1133.4" cy="405.7" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1180.7" cy="417.5" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1302.3" cy="447.8" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1326.2" cy="453.7" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1354.4" cy="460.8" r="7" class="acc-fill"/></g><g opacity="0.35"><circle cx="1301.1" cy="447.5" r="7" class="acc-fill"/></g><line x1="890" y1="345" x2="1212.4" y2="425.4" class="comp-strong" marker-end="url(#tip-a)"/><circle cx="1212.4" cy="425.4" r="12" class="acc-fill"/><rect x="60" y="660" width="1480" height="216" rx="14" class="strip"/><text x="92" y="710" class="h" text-anchor="start">Forward speed is the yaw lever</text><text x="92" y="760" class="eq" text-anchor="start">&#7805;&#8202;y &#8722; (&#969;&#8201;p&#8202;x &#8722; slip) / cos&#8201;&#968;  =  &#8722;tan&#8201;&#968; &#183; &#7805;&#8202;x</text><text x="92" y="806" class="note" text-anchor="start">one mount angle, every speed, every turn: one line through the origin</text><text x="92" y="840" class="note" text-anchor="start">speed only stretches the arrow &#8212; at zero forward speed the dot sits on the origin and says nothing about &#968;</text><text x="1508" y="710" class="lbl" text-anchor="end">no second sensor, no shared clock</text><text x="1508" y="850" class="lbl" text-anchor="end">schematic &#183; &#968; exaggerated</text></svg>