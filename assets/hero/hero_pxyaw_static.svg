<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="790 0 770 658" role="img" aria-labelledby="pt pd"><title id="pt">A turn induces a lateral sensor velocity equal to turn rate times the longitudinal lever arm</title><desc id="pd">Schematic. A vehicle turns steadily about an instantaneous centre of rotation. The axle point has no lateral velocity, while the sensor, mounted a lever arm ahead of it, gains a lateral velocity equal to the turn rate times that lever arm. No numbers with units appear; the figure is a mechanism sketch, not a measurement.</desc><style>
    .panel { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1.6; }
    .body { fill: #f5f5f3; stroke: #d8d8d8; stroke-width: 1.8; }
    .road { fill: none; stroke: #d8d8d8; stroke-width: 6; stroke-linecap: round; }
    .trace { fill: none; stroke: #191919; stroke-width: 5; stroke-linecap: round; opacity: .55; }
    .fg-thin { fill: none; stroke: #666666; stroke-width: 1.8; }
    .fg-arrow { fill: none; stroke: #666666; stroke-width: 2.4; }
    .rule-line { fill: none; stroke: #d8d8d8; stroke-width: 2; }
    .rule-dash { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 7 6; }
    .ink-dash { fill: none; stroke: #666666; stroke-width: 1.8; stroke-dasharray: 8 7; }
    .axis-dash { fill: none; stroke: #a52e29; stroke-width: 1.8; stroke-dasharray: 8 7; opacity: .75; }
    .fit { fill: none; stroke: #666666; stroke-width: 2.6; }
    .gate-band { fill: #d8d8d8; opacity: .45; }
    .bracket { fill: none; stroke: #191919; stroke-width: 2.2; }
    .axle { fill: none; stroke: #191919; stroke-width: 6; stroke-linecap: round; }
    .v-ink { fill: none; stroke: #191919; stroke-width: 4; }
    .v-thin { fill: none; stroke: #191919; stroke-width: 2.2; }
    .comp { fill: none; stroke: #a52e29; stroke-width: 3; opacity: .8; }
    .comp-strong { fill: none; stroke: #a52e29; stroke-width: 5; }
    .ink-fill { fill: #191919; stroke: #ffffff; stroke-width: 2.5; }
    .acc-fill { fill: #a52e29; stroke: #ffffff; stroke-width: 2.5; }
    .acc-open { fill: #ffffff; stroke: #a52e29; stroke-width: 3.4; }
    .icr-dot { fill: #ffffff; stroke: #666666; stroke-width: 3; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #191919; }
    .h { font-size: 33px; font-weight: 700; }
    .lbl { font-size: 23px; fill: #666666; }
    .note { font-size: 25px; fill: #666666; }
    .big-m { font-size: 44px; font-weight: 700; fill: #666666; }
    .sym { font-size: 30px; font-weight: 700; fill: #666666; }
    .sym-s { font-size: 21px; font-weight: 700; fill: #666666; }
    .symi { font-size: 30px; font-weight: 700; fill: #191919; }
    .symi-s { font-size: 21px; font-weight: 700; fill: #191919; }
    .syma { font-size: 30px; font-weight: 700; fill: #a52e29; }
    .syma-s { font-size: 21px; font-weight: 700; fill: #a52e29; }
</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker><marker id="tip-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#191919"/></marker><marker id="tip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a52e29"/></marker><g id="asmTurn"><rect x="-40" y="-30" width="236" height="60" rx="16" class="body"/><line x1="0" y1="-30" x2="0" y2="30" class="axle"/><line x1="0" y1="34" x2="0" y2="56" class="fg-thin"/><line x1="150" y1="34" x2="150" y2="56" class="fg-thin"/><line x1="0" y1="56" x2="150" y2="56" class="bracket" marker-start="url(#tip-i)" marker-end="url(#tip-i)"/><circle cx="0" cy="0" r="10" class="ink-fill"/><circle cx="150" cy="0" r="11" class="acc-fill"/><line x1="0" y1="0" x2="86" y2="0" class="v-ink" marker-end="url(#tip-i)"/><line x1="150" y1="0" x2="260" y2="0" class="ink-dash"/><line x1="150" y1="0" x2="260" y2="-55" class="v-thin" marker-end="url(#tip-i)"/><line x1="260" y1="0" x2="260" y2="-55" class="comp-strong" marker-end="url(#tip-a)"/></g></defs><rect x="790" y="0" width="770" height="658" fill="#ffffff"/><text x="1175" y="46" class="h" text-anchor="middle">Turning slides a forward sensor sideways.</text><text x="1175" y="80" class="lbl" text-anchor="middle">Lateral velocity = turn rate &#215; longitudinal lever arm.</text><rect x="810" y="104" width="730" height="530" rx="14" class="panel"/><text x="842" y="150" class="h" text-anchor="start">Steady turn</text><text x="1510" y="194" class="big-m" text-anchor="end">&#969; &#8800; 0</text><text x="842" y="590" class="note" text-anchor="start">The axle point has no lateral velocity at all.</text><text x="842" y="620" class="note" text-anchor="start">What the sensor sees is the lever arm times &#969;.</text><line x1="1175" y1="170" x2="1175" y2="470" class="rule-dash"/><circle cx="1175" cy="170" r="9" class="icr-dot"/><line x1="1153" y1="170" x2="1197" y2="170" class="fg-thin"/><line x1="1175" y1="148" x2="1175" y2="192" class="fg-thin"/><text x="1149" y="212" class="sym" text-anchor="end">ICR</text><path d="M 1223.9 147.2 A 54 54 0 0 0 1126.1 147.2" class="fg-arrow" marker-end="url(#tip)"/><text x="1247" y="180" class="sym" text-anchor="start">&#969;</text><path d="M 982.2 399.8 L 988.9 405.3 L 995.9 410.6 L 1002.9 415.7 L 1010.1 420.6 L 1017.5 425.3 L 1025 429.8 L 1032.6 434.1 L 1040.4 438.1 L 1048.2 441.9 L 1056.2 445.5 L 1064.2 448.8 L 1072.4 451.9 L 1080.6 454.8 L 1089 457.4 L 1097.4 459.8 L 1105.8 461.9 L 1114.3 463.8 L 1122.9 465.4 L 1131.5 466.8 L 1140.2 468 L 1148.9 468.9 L 1157.6 469.5 L 1166.3 469.9 L 1175 470 L 1183.7 469.9 L 1192.4 469.5 L 1201.1 468.9 L 1209.8 468 L 1218.5 466.8 L 1227.1 465.4 L 1235.7 463.8 L 1244.2 461.9 L 1252.6 459.8 L 1261 457.4 L 1269.4 454.8 L 1277.6 451.9 L 1285.8 448.8 L 1293.8 445.5 L 1301.8 441.9 L 1309.6 438.1 L 1317.4 434.1 L 1325 429.8 L 1332.5 425.3 L 1339.9 420.6 L 1347.1 415.7 L 1354.1 410.6 L 1361.1 405.3 L 1367.8 399.8" class="road"/><path d="M 982.2 399.8 L 985.5 402.6 L 988.9 405.3 L 992.4 408 L 995.9 410.6 L 999.4 413.2 L 1002.9 415.7 L 1006.5 418.2 L 1010.1 420.6 L 1013.8 423 L 1017.5 425.3 L 1021.2 427.6 L 1025 429.8 L 1028.8 432 L 1032.6 434.1 L 1036.5 436.1 L 1040.4 438.1 L 1044.3 440 L 1048.2 441.9 L 1052.2 443.7 L 1056.2 445.5 L 1060.2 447.2 L 1064.2 448.8 L 1068.3 450.4 L 1072.4 451.9 L 1076.5 453.4 L 1080.6 454.8 L 1084.8 456.1 L 1089 457.4 L 1093.1 458.6 L 1097.4 459.8 L 1101.6 460.9 L 1105.8 461.9 L 1110.1 462.9 L 1114.3 463.8 L 1118.6 464.7 L 1122.9 465.4 L 1127.2 466.2 L 1131.5 466.8 L 1135.8 467.4 L 1140.2 468 L 1144.5 468.4 L 1148.9 468.9 L 1153.2 469.2 L 1157.6 469.5 L 1161.9 469.7 L 1166.3 469.9 L 1170.6 470 L 1175 470" class="trace"/><g transform="translate(1175,470) rotate(-0)"><use href="#asmTurn" xlink:href="#asmTurn"/></g><text x="1238" y="556" class="symi" text-anchor="start">p</text><text x="1255" y="565" class="symi-s" text-anchor="start">x</text><text x="1451" y="419" class="syma" text-anchor="start">&#969; p</text><text x="1498" y="428" class="syma-s" text-anchor="start">x</text></svg>