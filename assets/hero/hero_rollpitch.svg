<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="rt rd"><title id="rt">How a single sensor recovers its mounting roll and pitch from turn rate alone</title><desc id="rd">Schematic in three panels. Left: a vehicle driving a circle on a locally planar patch of ground, with the rotation axis drawn as an arrow along the plane normal and a curved arrow showing the turn sense. Middle: the same vector seen in the coordinate frame of a sensor that is mounted with a tilt, so that pooled angular-rate samples from the gated turns cluster around a direction off the sensor's vertical axis and split into an in-plane part and a vertical part. Right: the rotation that swings that representative direction back onto the sensor's vertical axis; its roll and pitch are the mounting angles, while a rotation about the axis itself leaves the axis unchanged and so yaw is not determined here. A strip below marks roll and pitch as settled and yaw as left open, and notes that the step needs no target, no shared field of view and no clock shared with another sensor, only an agreed sign convention for the axis direction. No numbers with units appear; the figure is a mechanism sketch, not a measurement.</desc><style>
    .panel { fill: #ffffff; stroke: #d8d8d8; stroke-width: 1.6; }
    .ground { fill: #f5f5f3; stroke: #d8d8d8; stroke-width: 1.8; }
    .road { fill: none; stroke: #d8d8d8; stroke-width: 5; stroke-linecap: round; }
    .car { fill: #ffffff; stroke: #191919; stroke-width: 2.4; }
    .axis { fill: none; stroke: #666666; stroke-width: 2.6; }
    .omega { fill: none; stroke: #a52e29; stroke-width: 5; stroke-linecap: round; }
    .omega-ghost { fill: none; stroke: #a52e29; stroke-width: 2.6; stroke-dasharray: 9 8; opacity: .42; }
    .comp-dash { fill: none; stroke: #a52e29; stroke-width: 2; stroke-dasharray: 7 6; opacity: .7; }
    .fg-thin { fill: none; stroke: #666666; stroke-width: 1.8; }
    .fg-arrow { fill: none; stroke: #191919; stroke-width: 2.6; }
    .spin { fill: none; stroke: #666666; stroke-width: 2.2; }
    .foot { fill: none; stroke: #666666; stroke-width: 2; }
    .samp { fill: #a52e29; stroke: #ffffff; stroke-width: 2; opacity: .42; }
    .ink-fill { fill: #191919; stroke: #ffffff; stroke-width: 2.5; }
    .acc-fill { fill: #a52e29; stroke: none; }
    .chip-on { fill: #f5f5f3; stroke: #191919; stroke-width: 2.2; }
    .chip-off { fill: #ffffff; stroke: #d8d8d8; stroke-width: 2.2; stroke-dasharray: 8 7; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #191919; }
    .h { font-size: 32px; font-weight: 700; }
    .kick { font-size: 24px; font-weight: 700; fill: #666666; }
    .lbl { font-size: 21px; fill: #666666; }
    .lbl-ghost { font-size: 21px; fill: #a9a9a9; }
    .note { font-size: 22px; fill: #666666; }
    .chip-h { font-size: 27px; font-weight: 700; fill: #191919; }
    .chip-h-off { font-size: 27px; font-weight: 700; fill: #666666; }
    .chip-s { font-size: 20px; fill: #666666; }
    .sym { font-size: 28px; font-weight: 700; fill: #666666; }
    .sym-s { font-size: 20px; font-weight: 700; fill: #666666; }
    .symi { font-size: 28px; font-weight: 700; fill: #191919; }
    .symi-s { font-size: 20px; font-weight: 700; fill: #191919; }
    .syma { font-size: 28px; font-weight: 700; fill: #a52e29; }
    .syma-s { font-size: 20px; font-weight: 700; fill: #a52e29; }
</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker><marker id="tip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a52e29"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="800" y="48" class="h" text-anchor="middle">A turn carries one axis; a tilted sensor spreads it over three components.</text><text x="800" y="84" class="lbl" text-anchor="middle">Rotating that axis back onto the sensor's own vertical is what roll and pitch are &#8212; one sensor at a time.</text><rect x="40" y="104" width="480" height="520" rx="14" class="panel"/><text x="68" y="148" class="h" text-anchor="start">Planar turn</text><text x="68" y="192" class="lbl" text-anchor="start">vehicle on the plane</text><text x="494" y="192" class="kick" text-anchor="end">one axis</text><text x="68" y="550" class="note" text-anchor="start">On a locally planar surface a turn has</text><text x="68" y="578" class="note" text-anchor="start">a single rotation axis: the plane normal.</text><text x="68" y="606" class="note" text-anchor="start">Every sensor on the chassis shares it.</text><path d="M 84 512 L 150 330 L 410 330 L 476 512 Z" class="ground"/><path d="M 432 418 L 431.4 422.7 L 429.7 427.4 L 426.8 432 L 422.8 436.5 L 417.8 440.8 L 411.6 445 L 404.5 449 L 396.4 452.7 L 387.5 456.2 L 377.7 459.4 L 367.2 462.2 L 356 464.8 L 344.2 466.9 L 332 468.7 L 319.3 470.2 L 306.4 471.2 L 293.2 471.8 L 280 472 L 266.8 471.8 L 253.6 471.2 L 240.7 470.2 L 228 468.7 L 215.8 466.9 L 204 464.8 L 192.8 462.2 L 182.3 459.4 L 172.5 456.2 L 163.6 452.7 L 155.5 449 L 148.4 445 L 142.2 440.8 L 137.2 436.5 L 133.2 432 L 130.3 427.4 L 128.6 422.7 L 128 418 L 128.6 413.3 L 130.3 408.6 L 133.2 404 L 137.2 399.5 L 142.2 395.2 L 148.4 391 L 155.5 387 L 163.6 383.3 L 172.5 379.8 L 182.3 376.6 L 192.8 373.8 L 204 371.2 L 215.8 369.1 L 228 367.3 L 240.7 365.8 L 253.6 364.8 L 266.8 364.2 L 280 364 L 293.2 364.2 L 306.4 364.8 L 319.3 365.8 L 332 367.3 L 344.2 369.1 L 356 371.2 L 367.2 373.8 L 377.7 376.6 L 387.5 379.8 L 396.4 383.3 L 404.5 387 L 411.6 391 L 417.8 395.2 L 422.8 399.5 L 426.8 404 L 429.7 408.6 L 431.4 413.3 L 432 418" class="road" id="paOrbit"/><line x1="280" y1="418" x2="280" y2="250" class="omega" marker-end="url(#tip-a)"/><ellipse cx="280" cy="418" rx="16" ry="6" class="foot"/><path d="M 234 284 A 46 17 0 0 0 326 284" class="spin" marker-end="url(#tip)"/><text x="298" y="266" class="syma" text-anchor="start">&#969;</text><text x="466" y="506" class="lbl" text-anchor="end">ground plane</text><g><animateMotion dur="6.0s" repeatCount="indefinite" rotate="auto" calcMode="linear"><mpath href="#paOrbit" xlink:href="#paOrbit"/></animateMotion><g><rect x="-17" y="-9" width="34" height="18" rx="6" class="car"/><circle cx="12" cy="0" r="4" class="acc-fill"/></g></g><rect x="560" y="104" width="480" height="520" rx="14" class="panel"/><text x="588" y="148" class="h" text-anchor="start">Sensor axes</text><text x="588" y="192" class="lbl" text-anchor="start">pooled turn samples</text><text x="1014" y="192" class="kick" text-anchor="end">three components</text><text x="588" y="550" class="note" text-anchor="start">A tilted sensor does not see that axis</text><text x="588" y="578" class="note" text-anchor="start">along its own vertical. The same vector</text><text x="588" y="606" class="note" text-anchor="start">now has a part on every component.</text><g transform="translate(782,432)"><line x1="0" y1="0" x2="0" y2="-148" class="axis" marker-end="url(#tip)"/><line x1="0" y1="0" x2="128.8" y2="74" class="axis" marker-end="url(#tip)"/><line x1="0" y1="0" x2="-128.8" y2="74" class="axis" marker-end="url(#tip)"/><text x="-22" y="-142" class="sym" text-anchor="end">z</text><text x="144.8" y="82" class="sym" text-anchor="start">x</text><text x="-144.8" y="82" class="sym" text-anchor="end">y</text><circle cx="0" cy="0" r="8" class="ink-fill"/></g><circle cx="833.1" cy="269.9" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.060;0.080;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="864.2" cy="307.8" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.095;0.115;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="837.5" cy="301.3" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.130;0.150;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="877.8" cy="297.7" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.165;0.185;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="835.9" cy="287.8" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.200;0.220;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="864.5" cy="280" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.235;0.255;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="857.2" cy="309.2" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.270;0.290;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="851.7" cy="285.8" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.305;0.325;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="881.1" cy="287.8" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.340;0.360;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="832.1" cy="290.6" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.375;0.395;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><circle cx="858.3" cy="297.1" r="7" class="samp" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.410;0.430;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.460;0.510;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/><line x1="782" y1="432" x2="853.7" y2="291.2" class="omega" marker-end="url(#tip-a)"/><line x1="853.7" y1="291.2" x2="782" y2="291.2" class="comp-dash"/><line x1="782" y1="432" x2="782" y2="291.2" class="comp-dash"/><path d="M 782 354 A 78 78 0 0 1 817.4 362.5" class="fg-thin"/><text x="838.6" y="356.9" class="sym" text-anchor="start">tilt</text><text x="794" y="317.2" class="syma" text-anchor="start">&#969;</text><text x="813" y="326.2" class="syma-s" text-anchor="start">xy</text><text x="752" y="369.6" class="syma" text-anchor="start">&#969;</text><text x="771" y="378.6" class="syma-s" text-anchor="start">z</text></g><rect x="1080" y="104" width="480" height="520" rx="14" class="panel"/><text x="1108" y="148" class="h" text-anchor="start">Level the stream</text><text x="1108" y="192" class="lbl" text-anchor="start">the mounting rotation</text><text x="1534" y="192" class="kick" text-anchor="end">two angles</text><text x="1108" y="550" class="note" text-anchor="start">One rotation puts that axis back on the</text><text x="1108" y="578" class="note" text-anchor="start">vertical. Its roll and pitch are the mount.</text><text x="1108" y="606" class="note" text-anchor="start">Turning about the axis changes nothing.</text><g transform="translate(1302,432)"><line x1="0" y1="0" x2="0" y2="-148" class="axis" marker-end="url(#tip)"/><line x1="0" y1="0" x2="128.8" y2="74" class="axis" marker-end="url(#tip)"/><line x1="0" y1="0" x2="-128.8" y2="74" class="axis" marker-end="url(#tip)"/><text x="-22" y="-142" class="sym" text-anchor="end">z</text><text x="144.8" y="82" class="sym" text-anchor="start">x</text><text x="-144.8" y="82" class="sym" text-anchor="end">y</text><circle cx="0" cy="0" r="8" class="ink-fill"/></g><line x1="1302" y1="432" x2="1373.7" y2="291.2" class="omega-ghost"/><text x="1387" y="344.3" class="lbl-ghost" text-anchor="start">before</text><g transform="translate(1302,432)"><g><animateTransform attributeName="transform" type="rotate" values="27;27;0;0" keyTimes="0;0.580;0.860;1" dur="6.0s" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1" repeatCount="indefinite"/><line x1="0" y1="0" x2="0" y2="-158" class="omega" marker-end="url(#tip-a)"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.580;0.640;1" dur="6.0s" calcMode="linear" repeatCount="indefinite"/><path d="M 1345.6 346.5 A 96 96 0 0 0 1305.4 336.1" class="fg-arrow" marker-end="url(#tip)"/><text x="1358" y="280" class="symi" text-anchor="start">roll, pitch</text></g><rect x="40" y="654" width="1520" height="206" rx="14" class="panel"/><text x="84" y="710" class="h" text-anchor="start">What one sensor settles by itself</text><rect x="84" y="742" width="196" height="76" rx="12" class="chip-on"/><text x="106" y="780" class="chip-h" text-anchor="start">Roll</text><text x="106" y="806" class="chip-s" text-anchor="start">fixed here</text><rect x="300" y="742" width="196" height="76" rx="12" class="chip-on"/><text x="322" y="780" class="chip-h" text-anchor="start">Pitch</text><text x="322" y="806" class="chip-s" text-anchor="start">fixed here</text><rect x="516" y="742" width="196" height="76" rx="12" class="chip-off"/><text x="538" y="780" class="chip-h-off" text-anchor="start">Yaw</text><text x="538" y="806" class="chip-s" text-anchor="start">left open</text><text x="1516" y="710" class="note" text-anchor="end">Aligning one axis can only settle two angles: the turn about the axis</text><text x="1516" y="744" class="note" text-anchor="end">itself leaves it where it was, so yaw waits for the lever-arm step.</text><text x="1516" y="778" class="note" text-anchor="end">No target, no shared field of view, and no clock shared with another</text><text x="1516" y="812" class="note" text-anchor="end">sensor &#8212; only an agreed sign convention for the axis direction.</text></svg>