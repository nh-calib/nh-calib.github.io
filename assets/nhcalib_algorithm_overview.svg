<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">NH-Calib algorithm overview</title>
  <desc id="desc">Two-stage sensor-extrinsic calibration pipeline. Per-sensor odometry estimates roll, pitch, x and yaw. Associated turning segments estimate pairwise y, which is integrated in a sensor graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10253a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183e70"/><stop offset="1" stop-color="#102b51"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#703a1b"/><stop offset="1" stop-color="#4e2718"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155448"/><stop offset="1" stop-color="#0d3a32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#89a6c3"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#62b4ff"/></marker>
    <style>
      .k{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#ecf4fb}.title{font-size:44px;font-weight:750;letter-spacing:-1px}.sub{font-size:20px;fill:#aec2d4}.stage{font-size:15px;font-weight:700;letter-spacing:1.7px}.h{font-size:23px;font-weight:700}.b{font-size:17px;fill:#c8d7e5}.s{font-size:14px;fill:#9db4c8}.eq{font-family:Cambria Math,STIX Two Math,serif;font-size:18px;fill:#f6fbff}.num{font-size:15px;font-weight:800}.line{fill:none;stroke:#89a6c3;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.chip{font-size:14px;font-weight:650}.node{stroke:#31506d;stroke-width:1.5}.branchBlue{fill:none;stroke:#62b4ff;stroke-width:4;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>
  <text class="k title" x="70" y="78">NH-Calib — From Independent Odometry to 5-DoF Relative Extrinsics</text>
  <text class="k sub" x="70" y="113">No shared field of view · No map · No calibration target · No sample-level synchronization for Stage 1</text>

  <rect x="60" y="150" width="1480" height="112" rx="18" fill="#0c1a2a" stroke="#28445f"/>
  <text class="k stage" x="88" y="181" fill="#74c0ff">INPUT</text>
  <g transform="translate(90 201)">
    <circle cx="18" cy="14" r="13" fill="#3385c6"/><circle cx="57" cy="14" r="13" fill="#df8d3b"/><circle cx="96" cy="14" r="13" fill="#42a87f"/>
    <path d="M15 14l8-6v12zM54 14l8-6v12zM93 14l8-6v12z" fill="#fff" opacity=".8"/>
  </g>
  <text class="k h" x="220" y="220">Sensor-wise SE(3) odometry</text>
  <text class="k b" x="220" y="246">poses on each sensor's own clock → angular velocity ω̃<tspan baseline-shift="sub" font-size="12">j</tspan>(t), linear velocity ṽ<tspan baseline-shift="sub" font-size="12">j</tspan>(t)</text>
  <rect x="1080" y="180" width="410" height="52" rx="13" fill="#122d42"/><text class="k chip" x="1104" y="212" fill="#8fd3ff">Optional speed v<tspan baseline-shift="sub" font-size="10">c</tspan> from chassis / INS / CAN</text>

  <text class="k stage" x="65" y="305" fill="#74c0ff">STAGE 1 · EACH SENSOR INDEPENDENTLY</text>
  <path class="branchBlue" d="M325 262v58"/>
  <g filter="url(#shadow)">
    <rect class="node" x="60" y="325" width="330" height="225" rx="20" fill="url(#blue)"/>
    <circle cx="94" cy="362" r="17" fill="#55aef5"/><text class="k num" x="89" y="368">1</text>
    <text class="k h" x="124" y="370">Turn segments</text>
    <path d="M92 440c35-6 39-70 78-68 44 2 35 93 82 91 43-2 51-54 90-55" fill="none" stroke="#7cc5ff" stroke-width="4"/>
    <path d="M90 419h254M90 466h254" stroke="#95aac0" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="k s" x="90" y="496">entry / exit: |ω<tspan baseline-shift="sub" font-size="10">z</tspan>| ≥ 5 deg/s</text>
    <text class="k s" x="90" y="518">peak ≥ 15 deg/s · |Δθ| ≥ 30 deg</text>

    <rect class="node" x="435" y="325" width="330" height="225" rx="20" fill="url(#blue)"/>
    <circle cx="469" cy="362" r="17" fill="#55aef5"/><text class="k num" x="464" y="368">2</text>
    <text class="k h" x="499" y="370">Roll &amp; Pitch</text>
    <line x1="530" y1="492" x2="530" y2="404" stroke="#7cc5ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <line x1="530" y1="492" x2="615" y2="470" stroke="#7b91a8" stroke-width="3"/>
    <line x1="530" y1="492" x2="480" y2="452" stroke="#7b91a8" stroke-width="3"/>
    <path d="M645 486a73 73 0 0 0-58-70" fill="none" stroke="#f2ae62" stroke-width="4"/>
    <text class="k eq" x="590" y="430">ω̃<tspan baseline-shift="sub" font-size="12">j</tspan> ≃ ω a<tspan baseline-shift="sub" font-size="12">j</tspan></text>
    <text class="k s" x="470" y="523">weighted axis + branch selection + Rodrigues</text>

    <rect class="node" x="810" y="325" width="470" height="225" rx="20" fill="url(#blue)"/>
    <circle cx="844" cy="362" r="17" fill="#55aef5"/><text class="k num" x="839" y="368">3</text>
    <text class="k h" x="874" y="370">X, Yaw &amp; slip coefficient</text>
    <text class="k b" x="844" y="416">Huber IRLS Gauss–Newton</text>
    <text class="k eq" x="844" y="451">r = sinψ ṽ<tspan baseline-shift="sub" font-size="12">x</tspan> + cosψ ṽ<tspan baseline-shift="sub" font-size="12">y</tspan> − ωp<tspan baseline-shift="sub" font-size="12">x</tspan></text>
    <text class="k eq" x="844" y="481">    + v<tspan baseline-shift="sub" font-size="12">c</tspan> tan(c v<tspan baseline-shift="sub" font-size="12">c</tspan> ω)</text>
    <text class="k s" x="844" y="523">classical NHC: c = 0 · slip-aware: shared c</text>

    <rect class="node" x="1325" y="325" width="215" height="225" rx="20" fill="url(#green)"/>
    <circle cx="1359" cy="362" r="17" fill="#52c89a"/><text class="k num" x="1354" y="368">4</text>
    <text class="k h" x="1389" y="370">Relativize</text>
    <text class="k eq" x="1351" y="425">T̂<tspan baseline-shift="sub" font-size="12">rj</tspan> = T̂<tspan baseline-shift="sub" font-size="12">Vr</tspan>⁻¹ T̂<tspan baseline-shift="sub" font-size="12">Vj</tspan></text>
    <text class="k s" x="1351" y="464">compose rotations;</text>
    <text class="k s" x="1351" y="486">do not subtract Euler angles</text>
    <rect x="1351" y="508" width="160" height="27" rx="13" fill="#1f725f"/><text class="k chip" x="1367" y="527">x · yaw · roll · pitch</text>
  </g>
  <path class="line" d="M390 438h45"/><path class="line" d="M765 438h45"/><path class="line" d="M1280 438h45"/>

  <text class="k stage" x="65" y="602" fill="#ffb667">STAGE 2 · BETWEEN SENSORS, ONLY FOR RELATIVE Y</text>
  <path d="M225 550v66" fill="none" stroke="#df8d3b" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="60" y="622" width="370" height="250" rx="20" fill="url(#orange)"/>
    <circle cx="94" cy="659" r="17" fill="#f1a253"/><text class="k num" x="89" y="665">5</text>
    <text class="k h" x="124" y="667">Align &amp; associate</text>
    <path d="M92 735c35-60 70 58 108-5s80 54 116-5" fill="none" stroke="#71b9f0" stroke-width="4"/>
    <path d="M92 764c38-59 72 59 110-4s79 53 114-5" fill="none" stroke="#f3a657" stroke-width="4"/>
    <line x1="125" y1="704" x2="125" y2="800" stroke="#e8d48e" stroke-width="3" stroke-dasharray="6 5"/>
    <line x1="292" y1="704" x2="292" y2="800" stroke="#e8d48e" stroke-width="3" stroke-dasharray="6 5"/>
    <text class="k s" x="92" y="830">cross-correlation → common window → interpolation</text>
    <text class="k s" x="92" y="852">quality gate: cosine similarity + NRMSE</text>

    <rect class="node" x="475" y="622" width="410" height="250" rx="20" fill="url(#orange)"/>
    <circle cx="509" cy="659" r="17" fill="#f1a253"/><text class="k num" x="504" y="665">6</text>
    <text class="k h" x="539" y="667">Sum-form relative Y</text>
    <path d="M540 807a126 126 0 0 1 203-101" fill="none" stroke="#71b9f0" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M563 820a103 103 0 0 1 166-82" fill="none" stroke="#f3a657" stroke-width="4" stroke-dasharray="8 6"/>
    <text class="k eq" x="530" y="723">I<tspan baseline-shift="sub" font-size="12">j,k</tspan> = ∫ v<tspan baseline-shift="sub" font-size="12">j,x</tspan>(t) dt</text>
    <text class="k eq" x="530" y="755">W<tspan baseline-shift="sub" font-size="12">k</tspan> = ∫ ω(t) dt</text>
    <text class="k eq" x="530" y="850">ΔI<tspan baseline-shift="sub" font-size="12">k</tspan> = −Δp<tspan baseline-shift="sub" font-size="12">y,ij</tspan> W<tspan baseline-shift="sub" font-size="12">k</tspan></text>

    <rect class="node" x="930" y="622" width="350" height="250" rx="20" fill="url(#orange)"/>
    <circle cx="964" cy="659" r="17" fill="#f1a253"/><text class="k num" x="959" y="665">7</text>
    <text class="k h" x="994" y="667">Pairwise regression</text>
    <line x1="988" y1="816" x2="1215" y2="816" stroke="#8299ad" stroke-width="2"/><line x1="988" y1="816" x2="988" y2="710" stroke="#8299ad" stroke-width="2"/>
    <line x1="1000" y1="801" x2="1205" y2="727" stroke="#f1a253" stroke-width="4"/>
    <g fill="#d8ebf7"><circle cx="1020" cy="788" r="5"/><circle cx="1055" cy="775" r="5"/><circle cx="1092" cy="767" r="5"/><circle cx="1125" cy="751" r="5"/><circle cx="1164" cy="747" r="5"/><circle cx="1194" cy="730" r="5"/></g>
    <text class="k s" x="990" y="846">edge d<tspan baseline-shift="sub" font-size="10">ij</tspan> + confidence w<tspan baseline-shift="sub" font-size="10">ij</tspan></text>

    <rect class="node" x="1325" y="622" width="215" height="250" rx="20" fill="url(#green)"/>
    <circle cx="1359" cy="659" r="17" fill="#52c89a"/><text class="k num" x="1354" y="665">8</text>
    <text class="k h" x="1389" y="667">Y graph</text>
    <g stroke="#7ce0ba" stroke-width="3" fill="#173d37"><line x1="1380" y1="750" x2="1475" y2="720"/><line x1="1380" y1="750" x2="1450" y2="818"/><line x1="1475" y1="720" x2="1500" y2="795"/><line x1="1450" y1="818" x2="1500" y2="795"/><circle cx="1380" cy="750" r="15"/><circle cx="1475" cy="720" r="15"/><circle cx="1450" cy="818" r="15"/><circle cx="1500" cy="795" r="15"/></g>
    <text class="k eq" x="1350" y="703">min Σ ρ(w<tspan baseline-shift="sub" font-size="11">ij</tspan> e<tspan baseline-shift="sub" font-size="11">ij</tspan>)</text>
    <text class="k s" x="1352" y="852">fix y<tspan baseline-shift="sub" font-size="10">r</tspan> = 0</text>
  </g>
  <path class="line" d="M430 747h45"/><path class="line" d="M885 747h45"/><path class="line" d="M1280 747h45"/>

  <path d="M1430 550v52" fill="none" stroke="#52c89a" stroke-width="4"/>
  <path d="M1430 872v42" fill="none" stroke="#52c89a" stroke-width="4"/>
  <rect x="1080" y="914" width="460" height="78" rx="18" fill="#155448" stroke="#52c89a" stroke-width="2"/>
  <text class="k stage" x="1106" y="944" fill="#8ff0cb">OUTPUT</text>
  <text class="k h" x="1106" y="973">Reference-relative 5-DoF: x, y, yaw, roll, pitch</text>
  <rect x="60" y="926" width="910" height="66" rx="17" fill="#0c1a2a" stroke="#28445f"/>
  <text class="k b" x="88" y="953">Observability split:</text><text class="k s" x="255" y="953">vertical translation is not observable under the planar-motion model.</text>
  <text class="k b" x="88" y="979">Optional absolute Y:</text><text class="k s" x="255" y="979">add rear-axle CAN wheel odometry as a virtual node at p<tspan baseline-shift="sub" font-size="10">y</tspan> = 0.</text>
</svg>
