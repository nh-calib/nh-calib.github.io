<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Target-based calibration versus NH-Calib</title>
  <desc id="d">Left: a sensor observing a checkerboard target on a tripod inside a calibration room, marked as a limitation. Right: a vehicle driving a turning trajectory on an ordinary road, marked as the NH-Calib input.</desc>

  <style>
    .fg { fill: none; stroke: #191919; stroke-width: 1.6; }
    .fg-thin { fill: none; stroke: #666666; stroke-width: 1.2; }
    .rule { fill: none; stroke: #d8d8d8; stroke-width: 1.2; }
    .acc { fill: none; stroke: #a52e29; stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 4; }
    .dot { stroke-dasharray: 2 3; }
    .soft { fill: #f5f5f3; stroke: none; }
    .body { fill: #ffffff; stroke: #191919; stroke-width: 1.6; }
    .ink-fill { fill: #191919; stroke: none; }
    .acc-fill { fill: #a52e29; stroke: none; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #191919; }
    .h { font-size: 15px; font-weight: 700; }
    .h-acc { font-size: 15px; font-weight: 700; fill: #a52e29; }
    .lbl { font-size: 12.5px; fill: #666666; }
    .lbl-ink { font-size: 12.5px; fill: #191919; }
    .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; fill: #666666; }
    .mono { font-size: 13px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1 L 6 4 L 0 7 z" fill="#666666" /></marker></defs>
  <text class="tag" x="20" y="26">CONVENTIONAL</text>
  <text class="h" x="20" y="48">A prepared target scene</text>
  <rect class="fg" x="186" y="96" width="96" height="72" />
  <rect class="ink-fill" x="186.0" y="96.0" width="24.0" height="24.0" />
  <rect class="ink-fill" x="234.0" y="96.0" width="24.0" height="24.0" />
  <rect class="ink-fill" x="210.0" y="120.0" width="24.0" height="24.0" />
  <rect class="ink-fill" x="258.0" y="120.0" width="24.0" height="24.0" />
  <rect class="ink-fill" x="186.0" y="144.0" width="24.0" height="24.0" />
  <rect class="ink-fill" x="234.0" y="144.0" width="24.0" height="24.0" />
  <path class="fg" d="M 234 168 L 234 214" />
  <path class="fg" d="M 234 214 L 210 286 M 234 214 L 258 286 M 234 214 L 240 284" />
  <rect class="body" x="52" y="176" width="40" height="27" rx="4" />
  <circle class="ink-fill" cx="72" cy="189" r="5" />
  <text class="lbl" x="72" y="222" text-anchor="middle">sensor</text>
  <path class="fg-thin dash" d="M 92 182 L 186 100 M 92 190 L 186 168 M 92 198 L 186 136" />
  <path class="fg-thin" d="M 60 254 L 226 254" />
  <path class="fg-thin" d="M 60 248 L 60 260 M 226 248 L 226 260" />
  <text class="lbl" x="143" y="245" text-anchor="middle">measured placement</text>
  <line class="rule" x1="20" y1="300" x2="300" y2="300" />
  <text class="lbl" x="20" y="322">Calibration room, operator, re-run after</text>
  <text class="lbl" x="20" y="338">every mount change.</text>
  <circle cx="288" cy="313" r="9" fill="none" stroke="#a52e29" stroke-width="1.6" />
  <path class="acc" d="M 283.5 308.5 L 292.5 317.5 M 292.5 308.5 L 283.5 317.5" />

  <line class="rule" x1="320" y1="18" x2="320" y2="342" />

  <text class="tag" x="350" y="26" fill="#a52e29">NH-CALIB</text>
  <text class="h" x="350" y="48">Any drive that turns</text>
  <path d="M 436 278 C 436 224 458 182 508 162 C 552 144 592 144 620 136" fill="none" stroke="#f5f5f3" stroke-width="26" stroke-linecap="round" />
  <path d="M 436 278 C 436 224 458 182 508 162 C 552 144 592 144 620 136" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 5" />
  <g transform="translate(436 266) rotate(2) scale(0.6)">
    <rect class="body" x="-17" y="-29" width="34" height="58" rx="8" />
    <path class="fg-thin" d="M -12 -14 L 12 -14 M -12 8 L 12 8" />
    <rect class="ink-fill" x="-21" y="-22" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="16" y="-22" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="-21" y="12" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="16" y="12" width="5" height="11" rx="2" />
  </g>

  <g transform="translate(474 190) rotate(33) scale(0.6)">
    <rect class="body" x="-17" y="-29" width="34" height="58" rx="8" />
    <path class="fg-thin" d="M -12 -14 L 12 -14 M -12 8 L 12 8" />
    <rect class="ink-fill" x="-21" y="-22" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="16" y="-22" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="-21" y="12" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="16" y="12" width="5" height="11" rx="2" />
  </g>

  <g transform="translate(552 150) rotate(76) scale(0.6)">
    <rect class="body" x="-17" y="-29" width="34" height="58" rx="8" />
    <path class="fg-thin" d="M -12 -14 L 12 -14 M -12 8 L 12 8" />
    <rect class="ink-fill" x="-21" y="-22" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="16" y="-22" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="-21" y="12" width="5" height="11" rx="2" />
    <rect class="ink-fill" x="16" y="12" width="5" height="11" rx="2" />
  </g>

  <text class="lbl" x="350" y="194">no target</text>
  <text class="lbl" x="350" y="214">no operator</text>
  <text class="lbl" x="350" y="234">no site setup</text>
  <line class="rule" x1="350" y1="300" x2="620" y2="300" />
  <text class="lbl" x="350" y="322">Ordinary driving logs already contain the</text>
  <text class="lbl" x="350" y="338">turning motion the estimator needs.</text>
  <circle cx="608" cy="313" r="9" fill="none" stroke="#191919" stroke-width="1.6" />
  <path class="fg" d="M 603.5 313.3 L 606.8 316.6 L 612.8 309.2" />

</svg>
